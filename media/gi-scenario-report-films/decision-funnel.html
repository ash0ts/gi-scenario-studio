<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Six hundred ninety-nine plans enter. Twelve survive.</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-film="decision-funnel">
  <main aria-label="Interactive animation: Six hundred ninety-nine plans enter. Twelve survive.">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="The complete synthetic alternative universe narrows through volume, cost, peak, and QA rules."></canvas>
    <div class="controls">
      <button id="toggle" type="button" aria-label="Pause animation">Pause</button>
      <input id="scrub" type="range" min="0" max="38" step="0.01" value="0" aria-label="Animation timeline">
      <output id="clock" for="scrub">00:00 / 00:38</output>
    </div>
  </main>
  <script src="data/animation-data.js"></script>
  <script src="src/runtime.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What did the model say happened to the water?</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-film="modeled-water-ledger">
  <main aria-label="Interactive animation: What did the model say happened to the water?">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="Baseline and ALT-207 SWMM runoff ledgers are compared under the same synthetic long storm."></canvas>
    <div class="controls">
      <button id="toggle" type="button" aria-label="Pause animation">Pause</button>
      <input id="scrub" type="range" min="0" max="50" step="0.01" value="0" aria-label="Animation timeline">
      <output id="clock" for="scrub">00:00 / 00:50</output>
    </div>
  </main>
  <script src="data/animation-data.js"></script>
  <script src="src/runtime.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The biggest storm was not the most revealing test.</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-film="storm-reveals">
  <main aria-label="Interactive animation: The biggest storm was not the most revealing test.">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="Four synthetic storms reveal very different counts of adverse outlet-peak changes."></canvas>
    <div class="controls">
      <button id="toggle" type="button" aria-label="Pause animation">Pause</button>
      <input id="scrub" type="range" min="0" max="36" step="0.01" value="0" aria-label="Animation timeline">
      <output id="clock" for="scrub">00:00 / 00:36</output>
    </div>
  </main>
  <script src="data/animation-data.js"></script>
  <script src="src/runtime.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can AI earn the right to choose the next simulation?</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-film="search-release-gate">
  <main aria-label="Interactive animation: Can AI earn the right to choose the next simulation?">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="A bounded search requests candidates, direct SWMM jobs reveal results, and the adaptive proposer faces release gates."></canvas>
    <div class="controls">
      <button id="toggle" type="button" aria-label="Pause animation">Pause</button>
      <input id="scrub" type="range" min="0" max="46" step="0.01" value="0" aria-label="Animation timeline">
      <output id="clock" for="scrub">00:00 / 00:46</output>
    </div>
  </main>
  <script src="data/animation-data.js"></script>
  <script src="src/runtime.js"></script>
</body>
</html>

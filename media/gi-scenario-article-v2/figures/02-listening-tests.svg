<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-labelledby="title desc">
  <title id="title">Three checks for choosing an explanation</title>
  <desc id="desc">The model selects a predefined answer structure. A relevant value crossing a fixed limit requires a plan for the changed result. Changing only an irrelevant value should keep the selected plan the same. Missing required evidence should select the insufficient-evidence plan. Each scenario is shown twice with reordered evidence and renamed identifiers; both presentations must behave correctly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <style>
      @font-face { font-family: Atkinson; src: url('../../gi-scenario-film/assets/fonts/AtkinsonHyperlegible-Regular.ttf'); }
      @font-face { font-family: Atkinson; src: url('../../gi-scenario-film/assets/fonts/AtkinsonHyperlegible-Bold.ttf'); font-weight: 700; }
      @font-face { font-family: PlexCondensed; src: url('../../gi-scenario-film/assets/fonts/IBMPlexSansCondensed-SemiBold.ttf'); font-weight: 600; }
      @font-face { font-family: PlexMono; src: url('../../gi-scenario-film/assets/fonts/IBMPlexMono-Regular.ttf'); }
      .eyebrow { font: 700 24px Atkinson, sans-serif; letter-spacing: 1.2px; fill: #08766F; }
      .headline { font: 600 48px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .subhead { font: 400 25px Atkinson, sans-serif; fill: #48616B; }
      .section { font: 700 29px Atkinson, sans-serif; fill: #17313A; }
      .body { font: 400 24px Atkinson, sans-serif; fill: #17313A; }
      .small { font: 400 20px Atkinson, sans-serif; fill: #48616B; }
      .label { font: 700 21px Atkinson, sans-serif; letter-spacing: .6px; fill: #17313A; }
      .tinyLabel { font: 700 17px Atkinson, sans-serif; letter-spacing: .35px; fill: #17313A; }
      .tableBody { font: 400 21px Atkinson, sans-serif; fill: #17313A; }
      .mono { font: 400 24px PlexMono, monospace; fill: #17313A; }
      .number { font: 600 64px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .numberSmall { font: 600 44px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .whiteLabel { font: 700 21px Atkinson, sans-serif; letter-spacing: .6px; fill: white; }
      .whiteBody { font: 400 24px Atkinson, sans-serif; fill: white; }
    </style>
  </defs>
  <rect width="1200" height="724" fill="#F5F7F6"/>
  <text x="68" y="58" class="eyebrow" text-anchor="start">CONTROLLED EVIDENCE TEST</text>
<text x="68" y="118" class="headline" text-anchor="start">Three checks for choosing an explanation</text>
<text x="68" y="158" class="subhead" text-anchor="start">A plan is a predefined answer structure; the model selects which one applies.</text>
<rect x="68" y="208" width="1064" height="116" rx="22" fill="#FFFFFF" stroke="#CBD8D8" stroke-width="2"/>
<circle cx="118" cy="266" r="28" fill="#B43D47" stroke="none" stroke-width="0"/>
<text x="118" y="275" class="whiteLabel" text-anchor="middle">1</text>
<text x="164" y="255" class="body" text-anchor="start">Relevant value crosses the limit</text>
<text x="164" y="290" class="small" text-anchor="start">the rule stays fixed</text>
<line x1="588" y1="266" x2="678" y2="266" stroke="#B43D47" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="708" y="226" width="388" height="80" rx="14" fill="#F6E3E5" stroke="#B43D47" stroke-width="2"/>
<text x="902" y="258" class="body" text-anchor="middle" style="fill:#B43D47"><tspan x="902" dy="0">Choose the plan for</tspan><tspan x="902" dy="30">the changed result</tspan></text>
<rect x="68" y="352" width="1064" height="116" rx="22" fill="#FFFFFF" stroke="#CBD8D8" stroke-width="2"/>
<circle cx="118" cy="410" r="28" fill="#2F6F9F" stroke="none" stroke-width="0"/>
<text x="118" y="419" class="whiteLabel" text-anchor="middle">2</text>
<text x="164" y="399" class="body" text-anchor="start">Only an irrelevant value changes</text>
<text x="164" y="434" class="small" text-anchor="start">relevant evidence stays fixed</text>
<line x1="588" y1="410" x2="678" y2="410" stroke="#2F6F9F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="708" y="370" width="388" height="80" rx="14" fill="#E4EFF6" stroke="#2F6F9F" stroke-width="2"/>
<text x="902" y="419" class="body" text-anchor="middle" style="fill:#2F6F9F"><tspan x="902" dy="0">Keep the same plan</tspan></text>
<rect x="68" y="496" width="1064" height="116" rx="22" fill="#FFFFFF" stroke="#CBD8D8" stroke-width="2"/>
<circle cx="118" cy="554" r="28" fill="#A96315" stroke="none" stroke-width="0"/>
<text x="118" y="563" class="whiteLabel" text-anchor="middle">3</text>
<text x="164" y="543" class="body" text-anchor="start">Required evidence is missing</text>
<text x="164" y="578" class="small" text-anchor="start">a result cannot be supported</text>
<line x1="588" y1="554" x2="678" y2="554" stroke="#A96315" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="708" y="514" width="388" height="80" rx="14" fill="#F6E9D8" stroke="#A96315" stroke-width="2"/>
<text x="902" y="546" class="body" text-anchor="middle" style="fill:#A96315"><tspan x="902" dy="0">Choose an insufficient-</tspan><tspan x="902" dy="30">evidence plan</tspan></text>
<text x="68" y="658" class="small" text-anchor="start">Each scenario is shown twice, with reordered evidence and renamed identifiers.</text>
<text x="68" y="688" class="small" text-anchor="start">Both presentations must produce the expected behavior for that scenario to pass.</text>
</svg>
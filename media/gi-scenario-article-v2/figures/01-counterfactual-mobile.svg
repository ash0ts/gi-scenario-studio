<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1170" viewBox="0 0 540 1170" role="img" aria-labelledby="title desc">
  <title id="title">The value crossed the limit; the selected plan stayed the same.</title>
  <desc id="desc">One representative synthetic validation case changes capacity ratio C-19 from 0.79 within a fixed 0.85 rule to 0.91 outside it, while the same predefined answer structure is selected. Both Weave traces were acknowledged. No answer was released. These are prepared test records from a separate project family, not SWMM results or field measurements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <style>
      @font-face { font-family: Atkinson; src: url('../../gi-scenario-film/assets/fonts/AtkinsonHyperlegible-Regular.ttf'); }
      @font-face { font-family: Atkinson; src: url('../../gi-scenario-film/assets/fonts/AtkinsonHyperlegible-Bold.ttf'); font-weight: 700; }
      @font-face { font-family: PlexCondensed; src: url('../../gi-scenario-film/assets/fonts/IBMPlexSansCondensed-SemiBold.ttf'); font-weight: 600; }
      @font-face { font-family: PlexMono; src: url('../../gi-scenario-film/assets/fonts/IBMPlexMono-Regular.ttf'); }
      .eyebrow { font: 700 21px Atkinson, sans-serif; letter-spacing: 1px; fill: #08766F; }
      .headline { font: 600 42px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .subhead { font: 400 24px Atkinson, sans-serif; fill: #48616B; }
      .section { font: 700 30px Atkinson, sans-serif; fill: #17313A; }
      .body { font: 400 26px Atkinson, sans-serif; fill: #17313A; }
      .small { font: 400 21px Atkinson, sans-serif; fill: #48616B; }
      .label { font: 700 24px Atkinson, sans-serif; letter-spacing: .4px; fill: #17313A; }
      .tinyLabel { font: 700 18px Atkinson, sans-serif; letter-spacing: .25px; fill: #17313A; }
      .mono { font: 400 27px PlexMono, monospace; fill: #17313A; }
      .number { font: 600 62px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .numberSmall { font: 600 46px PlexCondensed, Atkinson, sans-serif; fill: #17313A; }
      .whiteLabel { font: 700 23px Atkinson, sans-serif; fill: white; }
      .whiteBody { font: 400 24px Atkinson, sans-serif; fill: white; }
    </style>
  </defs>
  <rect width="540" height="1170" fill="#F5F7F6"/>
  <text x="30" y="46" class="eyebrow" text-anchor="start">ONE SYNTHETIC VALIDATION CASE</text>
<text x="30" y="102" class="headline" text-anchor="start">The value crossed the limit</text>
<text x="30" y="152" class="headline" text-anchor="start">The plan stayed the same</text>
<text x="30" y="194" class="subhead" text-anchor="start">Capacity ratio for C-19 · same question</text>
<rect x="30" y="230" width="480" height="266" rx="24" fill="#FFFFFF" stroke="#08766F" stroke-width="3"/>
<text x="56" y="270" class="label" text-anchor="start" style="fill:#08766F">ORIGINAL EVIDENCE</text>
<text x="56" y="334" class="number" text-anchor="start">C-19 = 0.79</text>
<text x="56" y="376" class="mono" text-anchor="start">declared rule  ≤  0.85</text>
<rect x="56" y="406" width="184" height="64" rx="12" fill="#08766F" stroke="#08766F" stroke-width="2"/>
<text x="148" y="446" class="whiteLabel" text-anchor="middle">RULE MET</text>
<rect x="258" y="406" width="224" height="64" rx="12" fill="#E4EFF6" stroke="#2F6F9F" stroke-width="2"/>
<text x="370" y="432" class="small" text-anchor="middle" style="fill:#2F6F9F"><tspan x="370" dy="0">Trace</tspan><tspan x="370" dy="25">acknowledged</tspan></text>
<rect x="30" y="526" width="480" height="266" rx="24" fill="#FFFFFF" stroke="#B43D47" stroke-width="3"/>
<text x="56" y="566" class="label" text-anchor="start" style="fill:#B43D47">CHANGED EVIDENCE</text>
<text x="56" y="630" class="number" text-anchor="start">C-19 = 0.91</text>
<text x="56" y="672" class="mono" text-anchor="start">declared rule  ≤  0.85</text>
<rect x="56" y="702" width="184" height="64" rx="12" fill="#B43D47" stroke="#B43D47" stroke-width="2"/>
<text x="148" y="742" class="whiteLabel" text-anchor="middle">RULE FAILED</text>
<rect x="258" y="702" width="224" height="64" rx="12" fill="#E4EFF6" stroke="#2F6F9F" stroke-width="2"/>
<text x="370" y="728" class="small" text-anchor="middle" style="fill:#2F6F9F"><tspan x="370" dy="0">Trace</tspan><tspan x="370" dy="25">acknowledged</tspan></text>
<rect x="30" y="832" width="480" height="150" rx="20" fill="#F6E9D8" stroke="#A96315" stroke-width="3"/>
<text x="270" y="873" class="body" text-anchor="middle" style="fill:#A96315"><tspan x="270" dy="0">Same predefined answer</tspan><tspan x="270" dy="32">structure selected</tspan></text>
<text x="270" y="944" class="small" text-anchor="middle">The test required a different plan.</text>
<text x="270" y="1018" class="body" text-anchor="middle">No answer was released.</text>
<text x="30" y="1074" class="small" text-anchor="start"><tspan x="30" dy="0">Prepared synthetic evidence</tspan><tspan x="30" dy="30">C-19 is a test identifier, not a surveyed asset.</tspan><tspan x="30" dy="30">One representative validation pair.</tspan></text>

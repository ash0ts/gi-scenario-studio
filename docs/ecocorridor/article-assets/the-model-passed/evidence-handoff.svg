   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="30.24" y="35.277187" transform="rotate(-0 30.24 35.277187)">Preparing a review brief</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5357" x="30.24" y="64.637812" transform="rotate(-0 30.24 64.637812)">Historical agent workflow</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="43.2" y="119.397656" transform="rotate(-0 43.2 119.397656)">1. Authorize direct evidence</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 147.477656)">Check scope, revision, and complete</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 167.010469)">scenario evidence.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a33f5b" x="43.2" y="202.458047" transform="rotate(-0 43.2 202.458047)">Missing or unauthorized → no draft</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="43.2" y="270.597656" transform="rotate(-0 43.2 270.597656)">2. Provider + read-only tools</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 298.677656)">The tested agent followed a fixed</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 316.902656)">tool sequence. It returned finding</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 335.127656)">selections, not report prose.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a33f5b" x="43.2" y="368.778047" transform="rotate(-0 43.2 368.778047)">Provider or tool failure → no draft</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="43.2" y="436.197656" transform="rotate(-0 43.2 436.197656)">3. Required release checks</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 465.585469)">Read back the exact Weave trace.</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 482.502656)">Recheck the source and permissions.</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 501.346758)">Validate selections; render words and</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(43.2 520.260469)">numbers from local evidence.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a33f5b" x="43.2" y="584.058047" transform="rotate(-0 43.2 584.058047)">Any check fails → no saved draft</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="43.2" y="652.197656" transform="rotate(-0 43.2 652.197656)">4. Save UNCONFIRMED draft</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5357" x="43.2" y="680.277656" transform="rotate(-0 43.2 680.277656)">No portfolio approval or model edits.</text>
   </g>
  </g>

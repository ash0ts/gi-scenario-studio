   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="28.740226" y="54.472871" transform="rotate(-0 28.740226 54.472871)">The agent can organize evidence. It cannot approve anything.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5357" x="28.740226" y="92.817166" transform="rotate(-0 28.740226 92.817166)">The actual handoff has two fail-closed exits and ends with a practitioner.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d8d" x="54.480211" y="150.36597" transform="rotate(-0 54.480211 150.36597)">1</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="84.510194" y="151.756212" transform="rotate(-0 84.510194 151.756212)">Reviewed inputs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(54.480211 191.370937)">Resistance, focal areas,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(54.480211 203.973808)">actions, rules</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d8d" x="329.040058" y="150.36597" transform="rotate(-0 329.040058 150.36597)">2</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="359.070041" y="151.756212" transform="rotate(-0 359.070041 151.756212)">Direct runs</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(329.040058 191.370937)">One Circuitscape job per</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(329.040058 203.973808)">portfolio × scenario</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d8d" x="603.599904" y="150.36597" transform="rotate(-0 603.599904 150.36597)">3</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="633.629887" y="151.756212" transform="rotate(-0 633.629887 151.756212)">Local evidence</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(603.599904 191.370937)">QA, claims, hashes,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(603.599904 203.973808)">complete ensemble</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5357" x="54.480211" y="386.707234" transform="rotate(-0 54.480211 386.707234)">4</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="84.510194" y="388.097477" transform="rotate(-0 84.510194 388.097477)">Optional agent</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(54.480211 427.712202)">Reads authorized aliases;</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(54.480211 440.315073)">selects known findings</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5357" x="329.040058" y="386.707234" transform="rotate(-0 329.040058 386.707234)">5</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="359.070041" y="388.097477" transform="rotate(-0 359.070041 388.097477)">Unconfirmed draft</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(329.040058 427.712202)">Local renderer supplies</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(329.040058 440.315073)">words, numbers, links</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b56b24" x="603.599904" y="386.707234" transform="rotate(-0 603.599904 386.707234)">6</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b2b" x="633.629887" y="388.097477" transform="rotate(-0 633.629887 388.097477)">Practitioner</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(603.599904 427.712202)">Chooses the next field</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #4b5357" transform="translate(603.599904 440.315073)">or feasibility check</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #a33f5b" transform="translate(633.625851 284.868945)">Incomplete / QA rejected</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #a33f5b" transform="translate(654.391976 295.911461)">→ no comparison</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #a33f5b" x="166.020149" y="533.812584" transform="rotate(-0 166.020149 533.812584)">Trace or validation fails → no draft</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b56b24" transform="translate(713.040502 518.689607)">No automatic</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #b56b24" transform="translate(709.57058 531.292478)">approval path</text>
   </g>

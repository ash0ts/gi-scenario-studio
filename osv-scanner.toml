# OSV-Scanner v2.3.8 exceptions. Every exception is advisory-specific and
# expires; a new advisory for the same package still fails CI.

# The gtk-rs 0.18 crates below are maintenance advisories, not disclosed
# vulnerabilities. They remain transitive requirements of Tauri's Linux
# WebKitGTK/GTK3 backend and currently have no patched 0.18 release.

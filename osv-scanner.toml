# glib 0.18.5 is also transitive through the Linux GTK3 stack. The advisory
# affects VariantStrIter methods that the application does not call directly;
# this is a temporary risk acceptance, not a claim that the dependency is safe.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-11-01
reason = "Temporary acceptance for transitive glib 0.18.5; direct 0.20 upgrade is incompatible with the current Tauri GTK3 stack."


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gi-scenario-studio"
version = "0.2.0"
description = "Decision-first SWMM green-infrastructure alternatives workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "GI Scenario Studio contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
science = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pymoo>=0.6.1",
]
geo = [
  "swmmanywhere>=0.2.2",
  "geopandas>=1.0",
]
ecocorridor = [
  "filelock>=3.20,<4",
  "rasterio==1.4.4; python_version < '3.12'",
  "rasterio==1.5.0; python_version >= '3.12'",
]
export = [
  "Jinja2>=3.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]
observability = [
  "wandb>=0.22.3,<1",
  "weave>=0.52.17,<1",
  "presidio-analyzer>=2.2.359,<3",
]
ecocorridor-agents = [
  "openai-agents==0.18.3",
]
ecocorridor-report = [
  "wandb-workspaces==0.4.5",
]
release = [
  "PyNaCl==1.6.2",
  "pyinstaller==6.21.0",
]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.6",
]

[project.scripts]
gi-scenario-worker = "gi_scenario_core.rpc_worker:main"
gi-studio-demo = "gi_scenario_core.demo:main"
gi-studio-benchmark = "gi_scenario_core.benchmark:main"
ecocorridor-worker = "ecocorridor_core.rpc_worker:main"
ecocorridor-fixture = "ecocorridor_core.guided:main"
ecocorridor-benchmark = "ecocorridor_core.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = [
  "python/gi_scenario_core",
  "python/scenario_platform",
  "python/ecocorridor_core",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

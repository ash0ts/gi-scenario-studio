[package]
name = "gi-scenario-studio-desktop"
version = "0.1.0"
description = "Local desktop host for GI Scenario Studio"
authors = ["GI Scenario Studio contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[lib]
name = "gi_scenario_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

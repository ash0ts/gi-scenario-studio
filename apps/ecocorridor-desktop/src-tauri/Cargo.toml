[package]
name = "ecocorridor-scenario-studio-desktop"
version = "0.1.0"
description = "Native security host for EcoCorridor Scenario Studio"
authors = ["EcoCorridor Scenario Studio contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[lib]
name = "ecocorridor_scenario_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.5"
libc = "0.2"
scenario-host = { path = "../../../crates/scenario-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tinyfiledialogs = "3.9.1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
zeroize = "1.8"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "=2.10.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

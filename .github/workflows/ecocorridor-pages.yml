name: EcoCorridor synthetic public replay

on:
  workflow_dispatch:
    inputs:
      ridgeway_evidence_run_id:
        description: Successful same-commit protected Ridgeway producer run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ecocorridor-public-replay
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"
  PYTHON_VERSION: "3.12"

jobs:
  build-public-replay:
    name: Build manifest-approved synthetic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install minimal locked replay-policy dependencies
        run: uv sync --locked --no-dev --no-install-project

      - name: Resolve the exact protected Ridgeway producer artifact
        id: resolve_ridgeway_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIDGEWAY_EVIDENCE_RUN_ID: ${{ inputs.ridgeway_evidence_run_id }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Public replay may be deployed only from main."
            exit 1
          }
          test "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}" || {
            echo "::error::Pages workflow source differs from the checked-out commit."
            exit 1
          }
          [[ "${RIDGEWAY_EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Protected Ridgeway producer run ID must be a positive integer."
            exit 1
          }
          api_root="${RUNNER_TEMP}/ridgeway-actions-api"
          mkdir -p "${api_root}" "${RUNNER_TEMP}/ridgeway-producer"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RIDGEWAY_EVIDENCE_RUN_ID}" \
            > "${api_root}/run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RIDGEWAY_EVIDENCE_RUN_ID}/artifacts?name=ecocorridor-ridgeway-protected-evidence" \
            > "${api_root}/artifacts.json"
          uv run --no-sync python scripts/resolve_github_actions_provenance.py \
            --run-json "${api_root}/run.json" \
            --artifacts-json "${api_root}/artifacts.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --expected-run-id "${RIDGEWAY_EVIDENCE_RUN_ID}" \
            --expected-sha "${GITHUB_SHA}" \
            --expected-workflow-path .github/workflows/ecocorridor-ridgeway-evidence.yml \
            --expected-artifact-name ecocorridor-ridgeway-protected-evidence \
            --output "${RUNNER_TEMP}/ridgeway-producer-provenance.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Download the digest-verified protected Ridgeway producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.resolve_ridgeway_evidence.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ridgeway_evidence_run_id }}
          path: ${{ runner.temp }}/ridgeway-producer
          digest-mismatch: error

      - name: Verify producer identity and complete differential evidence
        run: |
          python3 scripts/github_actions_producer_identity.py verify \
            --identity "${RUNNER_TEMP}/ridgeway-producer/ridgeway-producer-identity.json" \
            --provenance "${RUNNER_TEMP}/ridgeway-producer-provenance.json"
          uv run --no-sync python scripts/verify_ridgeway_release_evidence.py \
            --publish-directory "${RUNNER_TEMP}/ridgeway-producer/ridgeway" \
            --desktop-fixture "${RUNNER_TEMP}/ridgeway-producer/desktop/ridgewayFixture.json"
          uv run --no-sync python scripts/compare_ridgeway_protected_rerun.py \
            --source-commit "${GITHUB_SHA}" \
            --reference-directory benchmarks/ecocorridor/ridgeway \
            --producer-directory "${RUNNER_TEMP}/ridgeway-producer/ridgeway" \
            --compare \
            "${RUNNER_TEMP}/ridgeway-producer/ridgeway-protected-rerun-differential.json" \
            --output "${RUNNER_TEMP}/ridgeway-producer-differential-recomputed.json"
          uv run --no-sync python scripts/validate_ridgeway_producer_attestation.py verify \
            --source-commit "${GITHUB_SHA}" \
            --publish-directory benchmarks/ecocorridor/ridgeway \
            --desktop-fixture apps/ecocorridor-desktop/src/data/ridgewayFixture.json \
            --producer-publish-directory "${RUNNER_TEMP}/ridgeway-producer/ridgeway" \
            --differential-report \
            "${RUNNER_TEMP}/ridgeway-producer/ridgeway-protected-rerun-differential.json" \
            --attestation \
            "${RUNNER_TEMP}/ridgeway-producer/ridgeway-protected-producer-attestation.json"

      - name: Verify synthetic fixture classification
        run: |
          uv sync --locked --extra ecocorridor --extra dev
          uv run --no-sync python scripts/check_ecological_data_manifest.py

      - name: Require semantically recomputed direct Ridgeway evidence
        run: >-
          uv run --no-sync python scripts/verify_ridgeway_release_evidence.py
          --publish-directory benchmarks/ecocorridor/ridgeway
          --desktop-fixture apps/ecocorridor-desktop/src/data/ridgewayFixture.json

      - name: Build the no-login replay
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/ecocorridor-replay build

      - name: Publish inspectable protected producer provenance with the replay
        shell: bash
        run: |
          cp "${RUNNER_TEMP}/ridgeway-producer/ridgeway-protected-producer-attestation.json" \
            apps/ecocorridor-replay/dist/ridgeway-protected-producer-attestation.json
          cp "${RUNNER_TEMP}/ridgeway-producer/ridgeway-producer-identity.json" \
            apps/ecocorridor-replay/dist/ridgeway-producer-identity.json
          cp "${RUNNER_TEMP}/ridgeway-producer-provenance.json" \
            apps/ecocorridor-replay/dist/ridgeway-producer-provenance.json
          cp "${RUNNER_TEMP}/ridgeway-producer/ridgeway-protected-rerun-differential.json" \
            apps/ecocorridor-replay/dist/ridgeway-protected-rerun-differential.json

      - name: Bind public replay bytes to this exact producer attempt
        shell: bash
        run: |
          python3 scripts/github_actions_producer_identity.py create \
            --output apps/ecocorridor-replay/dist/ecocorridor-pages-producer-identity.json \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-path .github/workflows/ecocorridor-pages.yml \
            --git-ref "${GITHUB_REF}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --workflow-sha "${GITHUB_WORKFLOW_SHA}" \
            --head-sha "${GITHUB_SHA}"

      - name: Verify static network and evidence boundaries
        run: >-
          uv run --no-sync python scripts/check_ecocorridor_public_replay.py
          --root apps/ecocorridor-replay/dist
          --source-sha "${GITHUB_SHA}"
          --fixture apps/ecocorridor-desktop/src/data/ridgewayFixture.json
          --projection benchmarks/ecocorridor/ridgeway/ui_projection.json
          --trust-record apps/ecocorridor-desktop/src/data/ridgewayReleaseTrust.json
          --data-manifest benchmarks/ecocorridor/data-manifest.json
          --require-verified-evidence

      - name: Install Playwright Chromium
        run: pnpm --dir apps/ecocorridor-replay exec playwright install --with-deps chromium

      - name: Crawl policy-safe production replay copy
        run: pnpm --dir apps/ecocorridor-replay test:rendered-copy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/ecocorridor-replay/dist

  deploy-public-replay:
    name: Deploy synthetic replay
    if: github.ref == 'refs/heads/main'
    needs: build-public-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

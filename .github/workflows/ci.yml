name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra science --extra export

      - name: Smoke-test the installed JSON-RPC worker entrypoint
        shell: bash
        run: |
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"system.ping","params":{}}' | uv run --no-sync gi-scenario-worker --transport jsonl-stdio --api-version 2.0)"
          RESPONSE="$response" uv run --no-sync python - <<'PY'
          import json
          import os

          lines = [line for line in os.environ["RESPONSE"].splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit("worker smoke test expected exactly one protocol response")
          response = json.loads(lines[0])
          if response.get("id") != 1 or response.get("result", {}).get("api_version") != "2.0":
              raise SystemExit("worker smoke test returned an incompatible protocol response")
          PY

      - name: Lint Python
        run: uv run --no-sync ruff check python tests scripts

      - name: Enforce repository secret boundary
        run: uv run --no-sync python scripts/check_repository_secrets.py

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check python tests scripts

      - name: Test Python core
        run: uv run --no-sync pytest tests/python

      - name: Regenerate public contracts
        run: uv run --no-sync python scripts/generate_schemas.py

      - name: Verify generated contracts are current
        run: git diff --exit-code -- schemas apps/desktop/src/generated/contracts.ts

      - name: Regenerate guided UI projection
        run: >-
          uv run --no-sync python scripts/generate_guided_ui_fixture.py
          --output "${RUNNER_TEMP}/guidedFixture.json"

      - name: Verify guided UI projection is current
        run: cmp "${RUNNER_TEMP}/guidedFixture.json" apps/desktop/src/data/guidedFixture.json

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test:frontend

      - name: Type-check and build frontend
        run: pnpm build

  rust:
    name: Rust desktop host
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Tauri
        run: pnpm build

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Provide inert sidecar fixture for Tauri discovery
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/gi-scenario-worker-${target}"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Lint Rust desktop host
        run: >-
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml
          --locked --all-targets -- -D warnings

      - name: Test Rust desktop host
        run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          --locked --all-targets

  dependency-review:
    name: Dependency and license policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

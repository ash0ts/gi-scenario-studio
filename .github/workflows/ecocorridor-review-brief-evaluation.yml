name: EcoCorridor protected Review Brief evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecocorridor-review-brief-evaluation
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  WANDB_CONSOLE: "off"
  WANDB_DISABLE_CODE: "true"
  WANDB_DISABLE_GIT: "true"
  WANDB_ERROR_REPORTING: "false"
  WANDB_SHOW_RUN: "false"

jobs:
  evaluate-and-append:
    name: Run provider campaign and append verified evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ecocorridor-observability-integration
    steps:
      - name: Require exact protected main source
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Review Brief evaluation may run only from main."
            exit 1
          }
          test "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}" || {
            echo "::error::Workflow source differs from the evaluated commit."
            exit 1
          }

      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up the pinned Canvas-film runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install the locked campaign and Report toolchain
        run: >-
          uv sync --locked --extra ecocorridor --extra ecocorridor-agents
          --extra observability --extra ecocorridor-report --extra dev

      - name: Run network-free campaign and publisher tests
        run: >-
          uv run --no-sync pytest -q
          tests/python/test_review_brief_evaluation_campaign.py
          tests/python/test_native_agents_runtime.py
          tests/python/test_review_brief_agent_runtime.py

      - name: Validate protected configuration without printing values
        shell: bash
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_SERVICE_ACCOUNT_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_SERVICE_ACCOUNT_ENTITY }}
          WANDB_PROJECT: ${{ vars.WANDB_INTEGRATION_PROJECT }}
          WANDB_EXTERNAL_PROJECT_ID: ${{ vars.WANDB_EXTERNAL_PROJECT_ID }}
          WANDB_BASE_URL: ${{ vars.WANDB_BASE_URL }}
          WANDB_WEB_BASE_URL: ${{ vars.WANDB_WEB_BASE_URL }}
          WANDB_REPORT_URL: ${{ vars.ECOCORRIDOR_REVIEW_BRIEF_REPORT_URL }}
          PROVIDER_API_KEY: ${{ secrets.ECOCORRIDOR_PROVIDER_API_KEY }}
          PROVIDER_NAME: ${{ vars.ECOCORRIDOR_PROVIDER_NAME }}
          PROVIDER_BASE_URL: ${{ vars.ECOCORRIDOR_PROVIDER_BASE_URL }}
          PROVIDER_MODEL: ${{ vars.ECOCORRIDOR_PROVIDER_MODEL }}
          PROVIDER_MODE: ${{ vars.ECOCORRIDOR_REVIEW_BRIEF_PROVIDER_MODE }}
          PROVIDER_COST_BASIS_REF: ${{ vars.ECOCORRIDOR_PROVIDER_COST_BASIS_REF }}
          PROVIDER_INPUT_USD_PER_MILLION: ${{ vars.ECOCORRIDOR_PROVIDER_INPUT_USD_PER_MILLION }}
          PROVIDER_OUTPUT_USD_PER_MILLION: ${{ vars.ECOCORRIDOR_PROVIDER_OUTPUT_USD_PER_MILLION }}
        run: |
          for name in \
            WANDB_API_KEY WANDB_ENTITY WANDB_PROJECT WANDB_EXTERNAL_PROJECT_ID \
            WANDB_BASE_URL WANDB_WEB_BASE_URL WANDB_REPORT_URL PROVIDER_API_KEY \
            PROVIDER_NAME PROVIDER_BASE_URL PROVIDER_MODEL PROVIDER_MODE \
            PROVIDER_COST_BASIS_REF PROVIDER_INPUT_USD_PER_MILLION \
            PROVIDER_OUTPUT_USD_PER_MILLION; do
            test -n "${!name:-}" || {
              echo "::error::Missing protected Review Brief configuration: ${name}."
              exit 1
            }
          done
          case "${PROVIDER_MODE}" in
            RESPONSES|CHAT_COMPLETIONS) ;;
            *)
              echo "::error::Provider mode must be RESPONSES or CHAT_COMPLETIONS."
              exit 1
              ;;
          esac
          case "${WANDB_REPORT_URL}" in
            https://*) ;;
            *)
              echo "::error::Existing Report URL must be HTTPS."
              exit 1
              ;;
          esac

      - name: Run the real three-method by fourteen-case campaign
        shell: bash
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_SERVICE_ACCOUNT_API_KEY }}
          ECOCORRIDOR_PROVIDER_API_KEY: ${{ secrets.ECOCORRIDOR_PROVIDER_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_SERVICE_ACCOUNT_ENTITY }}
          WANDB_PROJECT: ${{ vars.WANDB_INTEGRATION_PROJECT }}
          WANDB_EXTERNAL_PROJECT_ID: ${{ vars.WANDB_EXTERNAL_PROJECT_ID }}
          WANDB_BASE_URL: ${{ vars.WANDB_BASE_URL }}
          WANDB_WEB_BASE_URL: ${{ vars.WANDB_WEB_BASE_URL }}
          PROVIDER_NAME: ${{ vars.ECOCORRIDOR_PROVIDER_NAME }}
          PROVIDER_BASE_URL: ${{ vars.ECOCORRIDOR_PROVIDER_BASE_URL }}
          PROVIDER_MODEL: ${{ vars.ECOCORRIDOR_PROVIDER_MODEL }}
          PROVIDER_MODE: ${{ vars.ECOCORRIDOR_REVIEW_BRIEF_PROVIDER_MODE }}
          PROVIDER_COST_BASIS_REF: ${{ vars.ECOCORRIDOR_PROVIDER_COST_BASIS_REF }}
          PROVIDER_INPUT_USD_PER_MILLION: ${{ vars.ECOCORRIDOR_PROVIDER_INPUT_USD_PER_MILLION }}
          PROVIDER_OUTPUT_USD_PER_MILLION: ${{ vars.ECOCORRIDOR_PROVIDER_OUTPUT_USD_PER_MILLION }}
          WANDB_DIR: ${{ runner.temp }}/review-brief/wandb/run
          WANDB_CACHE_DIR: ${{ runner.temp }}/review-brief/wandb/cache
          WANDB_ARTIFACT_DIR: ${{ runner.temp }}/review-brief/wandb/artifacts
          WANDB_DATA_DIR: ${{ runner.temp }}/review-brief/wandb/data
        run: |
          mkdir -p \
            "${WANDB_DIR}" "${WANDB_CACHE_DIR}" \
            "${WANDB_ARTIFACT_DIR}" "${WANDB_DATA_DIR}"
          uv run --no-sync python scripts/run_ecocorridor_review_brief_evaluation.py \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --provider-name "${PROVIDER_NAME}" \
            --provider-base-url "${PROVIDER_BASE_URL}" \
            --provider-model "${PROVIDER_MODEL}" \
            --provider-mode "${PROVIDER_MODE}" \
            --provider-cost-basis-ref "${PROVIDER_COST_BASIS_REF}" \
            --provider-input-usd-per-million "${PROVIDER_INPUT_USD_PER_MILLION}" \
            --provider-output-usd-per-million "${PROVIDER_OUTPUT_USD_PER_MILLION}" \
            --wandb-entity "${WANDB_ENTITY}" \
            --wandb-project "${WANDB_PROJECT}" \
            --wandb-external-project-id "${WANDB_EXTERNAL_PROJECT_ID}" \
            --wandb-api-base-url "${WANDB_BASE_URL}" \
            --wandb-web-base-url "${WANDB_WEB_BASE_URL}" \
            --wandb-run-id "review-brief-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --authorize-synthetic-public-provider-evaluation \
            --output "${RUNNER_TEMP}/ecocorridor-review-brief-campaign.json"

      - name: Render only the complete verified campaign
        shell: bash
        run: |
          for binary in node ffmpeg ffprobe; do
            command -v "${binary}" >/dev/null || {
              echo "::error::Missing required Canvas-film binary: ${binary}."
              exit 1
            }
          done
          command -v google-chrome >/dev/null || \
            command -v google-chrome-stable >/dev/null || \
            command -v chromium >/dev/null || {
              echo "::error::Missing required Canvas-film Chrome/Chromium binary."
              exit 1
            }
          uv run --no-sync python scripts/render_ecocorridor_review_brief_animation.py \
            --campaign "${RUNNER_TEMP}/ecocorridor-review-brief-campaign.json" \
            --output-directory "${RUNNER_TEMP}/ecocorridor-review-brief-media" \
            --authorize-verified-provider-media-render

      - name: Append only the verified owned section to the existing Report
        shell: bash
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_SERVICE_ACCOUNT_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_SERVICE_ACCOUNT_ENTITY }}
          WANDB_PROJECT: ${{ vars.WANDB_INTEGRATION_PROJECT }}
          WANDB_BASE_URL: ${{ vars.WANDB_BASE_URL }}
          WANDB_WEB_BASE_URL: ${{ vars.WANDB_WEB_BASE_URL }}
          WANDB_REPORT_URL: ${{ vars.ECOCORRIDOR_REVIEW_BRIEF_REPORT_URL }}
          WANDB_DIR: ${{ runner.temp }}/review-brief/publisher/run
          WANDB_CACHE_DIR: ${{ runner.temp }}/review-brief/publisher/cache
          WANDB_ARTIFACT_DIR: ${{ runner.temp }}/review-brief/publisher/artifacts
          WANDB_DATA_DIR: ${{ runner.temp }}/review-brief/publisher/data
        run: |
          mkdir -p \
            "${WANDB_DIR}" "${WANDB_CACHE_DIR}" \
            "${WANDB_ARTIFACT_DIR}" "${WANDB_DATA_DIR}"
          uv run --no-sync python scripts/publish_ecocorridor_review_brief_report.py \
            --campaign "${RUNNER_TEMP}/ecocorridor-review-brief-campaign.json" \
            --entity "${WANDB_ENTITY}" \
            --project "${WANDB_PROJECT}" \
            --wandb-api-base-url "${WANDB_BASE_URL}" \
            --wandb-web-base-url "${WANDB_WEB_BASE_URL}" \
            --report-url "${WANDB_REPORT_URL}" \
            --media-manifest \
              "${RUNNER_TEMP}/ecocorridor-review-brief-media/review-brief-animation-media-manifest.json" \
            --authorize-synthetic-public-upload \
            --output "${RUNNER_TEMP}/ecocorridor-review-brief-publication-receipt.json"

      - name: Preserve the exact campaign and publication receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ecocorridor-review-brief-evaluation
          path: |
            ${{ runner.temp }}/ecocorridor-review-brief-campaign.json
            ${{ runner.temp }}/ecocorridor-review-brief-media
            ${{ runner.temp }}/ecocorridor-review-brief-publication-receipt.json
          if-no-files-found: error
          retention-days: 30
